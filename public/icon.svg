    <path d="M364 466H660C690 466 714 490 714 520" stroke="#ffffff" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
    <path d="M512 552C495.4 552 482 565.4 482 582C482 594 489 604.4 499 609.2V642C499 649.2 504.8 655 512 655C519.2 655 525 649.2 525 642V609.2C535 604.4 542 594 542 582C542 565.4 528.6 552 512 552Z" fill="url(#keyhole)"/>

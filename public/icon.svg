    <filter id="tile-shadow" x="32" y="44" width="960" height="960" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity=".15"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity=".1"/>
    </filter>
    <filter id="lock-shadow" x="240" y="190" width="544" height="660" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>kvault</title>
  <desc>A graphite lock on a softly sculpted pearl square, with transparent macOS icon margins.</desc>
  <defs>
    <linearGradient id="tile" x1="300" y1="100" x2="744" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".52" stop-color="#f8f9fb"/>
      <stop offset="1" stop-color="#e4e8ee"/>
    </linearGradient>
    <linearGradient id="tile-edge" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#e9edf2"/>
      <stop offset="1" stop-color="#bdc5cf"/>
    </linearGradient>
    <linearGradient id="steel" x1="352" y1="280" x2="656" y2="718" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8d97a7"/>
      <stop offset=".23" stop-color="#596476"/>
      <stop offset=".56" stop-color="#323d4e"/>
      <stop offset="1" stop-color="#141d2c"/>
    </linearGradient>
    <linearGradient id="shackle-glint" x1="512" y1="280" x2="512" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset=".65" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="face" x1="512" y1="474" x2="512" y2="748" gradientUnits="userSpaceOnUse">

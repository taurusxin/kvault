    <rect x="106" y="106" width="812" height="812" rx="178" stroke="#ffffff" stroke-opacity=".8" stroke-width="2"/>
  </g>
  <g filter="url(#lock-shadow)">
    <path d="M384 490V394C384 323.3 441.3 266 512 266C582.7 266 640 323.3 640 394V490" stroke="url(#steel)" stroke-width="56" stroke-linecap="round"/>
    <path d="M384 458V394C384 323.3 441.3 266 512 266C582.7 266 640 323.3 640 394V458" stroke="url(#shackle-glint)" stroke-width="10" stroke-linecap="round"/>
    <rect x="300" y="456" width="424" height="308" rx="64" fill="url(#steel)"/>
